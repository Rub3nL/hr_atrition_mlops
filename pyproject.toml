[project]
name = "hr-attrition-mlops"
version = "0.1.0"
description = "MLOps de punta a punta para predecir la rotación (attrition) de empleados con el dataset IBM HR Analytics"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ruben Jhonny Limachi Condori" }]
dependencies = [
    "fastapi[standard]>=0.143.1",
    "gradio>=6.30.0",
    "joblib>=1.6.0",
    "numpy>=2.5.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.0",
    "requests>=2.34.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
preparar-datos = "hr_attrition_mlops.data:main"
entrenar = "hr_attrition_mlops.train:main"
predecir = "hr_attrition_mlops.predict:main"
